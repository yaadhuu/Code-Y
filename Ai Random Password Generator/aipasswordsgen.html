<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Password Assistant</title>
    <link rel="stylesheet" href="aipasswordgen.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">SecurePass</div>
            <ul>
                <li><a href="#generate">Generate Password</a></li>
                <li><a href="#analyze">Analyze Strength</a></li>
                <li><a href="#about">About Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>AI-Powered Password Assistant</h1>
            <p>Generate strong passwords and analyze their security instantly!</p>
            <a href="#generate" class="btn-primary">Get Started</a>
        </section>

        <section id="generate" class="container">
            <h2>Generate a Secure Password</h2>
            <div class="password-container">
                <input type="text" id="password" placeholder="Your password will appear here" readonly>
                <button class="btn-secondary" onclick="generateAIpassword()">Generate Secure Password</button>
            </div>
        </section>

        <section id="analyze" class="container">
            <h2>Password Strength Report</h2>
            <p id="strength-analysis">Waiting for analysis...</p>
            <button class="btn-secondary" onclick="analyzePassword()">Analyze Password Strength</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 SecurePass. All rights reserved.</p>
    </footer>

    <script src="aipasswordgen.js"></script>
</body>
</html>
